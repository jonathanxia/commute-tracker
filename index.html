<!doctype html>
<html lang="en">
<head>

<title>Commute</title>

<meta name="theme-color" content="#0a0d13">
<meta name="description" content="Personal commute logger.">

     the page and see it. -->

<!-- Add to Home Screen: full-screen, no Safari chrome. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Commute">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app" aria-live="polite"></main>

<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tooltip" id="tooltip" role="tooltip"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
